name: Pubblica su GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5
      - name: Installa le dipendenze
        run: npm install
      - name: Genera il sito
        run: npm run build
      - name: Carica il sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Pubblica il sito
        id: deployment
        uses: actions/deploy-pages@v4
